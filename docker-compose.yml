version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: cyber_soc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyber_soc_db}
      POSTGRES_USER: ${POSTGRES_USER:-soc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_secure_pass_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soc_admin} -d ${POSTGRES_DB:-cyber_soc_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - soc_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber_soc_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyber_soc_db}
      POSTGRES_USER: ${POSTGRES_USER:-soc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_secure_pass_123}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://soc_admin:soc_secure_pass_123@postgres:5432/cyber_soc_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-default_insecure_development_secret_key_minimum_32_chars}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-AdminSecurePass123!}
    ports:
      - "8000:8000"
    networks:
      - soc_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyber_soc_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - soc_network

volumes:
  postgres_data:
    driver: local

networks:
  soc_network:
    driver: bridge
